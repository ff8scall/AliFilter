<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AliFilter 설정</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="logo-box">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
          </svg>
        </div>
        <div>
          <div class="title-wrap">
            <h1 class="title">AliFilter</h1>
          </div>
          <span class="subtitle">알리 정밀 검색 필터 & 스마트 툴바</span>
        </div>
      </div>
      <label class="switch" title="마스터 필터 On/Off (Alt+F)">
        <input type="checkbox" id="masterToggle" checked>
        <span class="slider round"></span>
      </label>
    </header>

    <!-- Main Settings Body -->
    <main class="settings-body">
      <!-- Current Status Card -->
      <div class="status-card" id="statusCard">
        <div class="status-indicator active" id="statusDot"></div>
        <div class="status-text-wrap">
          <div class="status-label" id="statusLabel">알리익스프레스 감지 대기</div>
          <div class="status-sub" id="statusSub">검색 페이지 접속 시 자동으로 실행됩니다.</div>
        </div>
      </div>

      <!-- Filter Mode Section -->
      <section class="section">
        <div class="section-header">
          <label class="section-title">미일치 상품 처리</label>
          <span class="section-hint">필수 키워드 누락 시</span>
        </div>
        <div class="segmented-control" id="modeControl">
          <button type="button" class="segment-btn active" data-mode="hide">
            <svg class="segment-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
            </svg>
            <span>숨김</span>
          </button>
          <button type="button" class="segment-btn" data-mode="dim">
            <svg class="segment-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <span>흐리게</span>
          </button>
          <button type="button" class="segment-btn" data-mode="highlight-only">
            <svg class="segment-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            <span>강조만</span>
          </button>
        </div>
      </section>

      <!-- Match Condition Section -->
      <section class="section">
        <div class="section-header">
          <label class="section-title">키워드 일치 규칙</label>
        </div>
        <div class="radio-card-group">
          <label class="radio-card">
            <input type="radio" name="matchCondition" value="AND" checked>
            <div class="radio-card-content">
              <div class="radio-header">
                <span class="custom-radio"></span>
                <strong>모든 키워드 필수 (AND)</strong>
              </div>
              <small>모든 검색 단어가 포함된 상품만 통과</small>
            </div>
          </label>
          <label class="radio-card">
            <input type="radio" name="matchCondition" value="OR">
            <div class="radio-card-content">
              <div class="radio-header">
                <span class="custom-radio"></span>
                <strong>일부 키워드 포함 (OR)</strong>
              </div>
              <small>키워드 중 1개 이상 포함되면 통과</small>
            </div>
          </label>
        </div>
      </section>

      <!-- Highlight Color Selector -->
      <section class="section">
        <div class="section-header">
          <label class="section-title">단어 강조 하이라이트 색상</label>
        </div>
        <div class="color-picker-group" id="colorPicker">
          <button type="button" class="color-dot active" data-color="#ffd60a" style="--c: #ffd60a;" title="소프트 앰버"></button>
          <button type="button" class="color-dot" data-color="#10b981" style="--c: #10b981;" title="민트 에메랄드"></button>
          <button type="button" class="color-dot" data-color="#0ea5e9" style="--c: #0ea5e9;" title="스카이 사파이어"></button>
          <button type="button" class="color-dot" data-color="#f97316" style="--c: #f97316;" title="코랄 오렌지"></button>
          <button type="button" class="color-dot" data-color="#a855f7" style="--c: #a855f7;" title="소프트 바이올렛"></button>
        </div>
      </section>

      <!-- Options Checkboxes -->
      <section class="section">
        <div class="section-header">
          <label class="section-title">화면 및 필터 편의 기능</label>
        </div>
        <div class="toggle-list">
          <label class="toggle-row">
            <div class="toggle-info">
              <span>광고 / 스폰서(Ad) 상품 자동 숨김</span>
              <small>검색 결과 사이사이에 끼어드는 무관한 광고 차단</small>
            </div>
            <input type="checkbox" id="hideAds" checked class="modern-checkbox">
          </label>
          <label class="toggle-row">
            <div class="toggle-info">
              <span>화면 플로팅 스마트 알약 바 표시</span>
              <small>드래그하여 원하는 위치로 자유롭게 이동 가능</small>
            </div>
            <input type="checkbox" id="showFloatingBar" checked class="modern-checkbox">
          </label>
          <label class="toggle-row">
            <div class="toggle-info">
              <span>상품 카드에 일치/미일치 배지 표시</span>
              <small>누락 단어 및 통과 여부를 카드 좌상단에 표시</small>
            </div>
            <input type="checkbox" id="showMatchBadge" checked class="modern-checkbox">
          </label>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-hint" id="saveMsg">설정이 실시간으로 자동 동기화됩니다.</div>
      <div class="kbd-guide">
        <span class="kbd">Alt</span> + <span class="kbd">F</span> 즉시 On/Off
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
